services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: lab-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot-net

  influxdb:
    image: influxdb:1.8
    container_name: lab-influx
    restart: unless-stopped
    environment:
      - INFLUXDB_DB=sensor_data
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb-data:/var/lib/influxdb
    networks:
      - iot-net

  node-red:
    image: nodered/node-red:latest
    container_name: lab-nodered
    restart: unless-stopped
    environment:
      - TZ=Europe/Madrid
    ports:
      - "1880:1880"
    volumes:
      - ./node-red-data:/data
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - iot-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: lab-grafana
    restart: unless-stopped
    user: "472"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - iot-net

networks:
  iot-net:
    external: true